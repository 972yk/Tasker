name: Сборка Flet APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # 1. Скачиваем код вашего репозитория
    - name: Checkout repository
      uses: actions/checkout@v4

    # 2. Устанавливаем Java (необходима для компиляции Android Gradle)
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    # 3. Устанавливаем точную версию Flutter SDK, которую требует Flet 1.0.4+
    # Это полностью уберет интерактивный вопрос "Proceed? [y/n]" и ошибку Broken pipe
    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.24.8'
        channel: 'stable'

    # 4. Автоматически принимаем все лицензии Android SDK в тихом режиме
    - name: Accept Android Licenses
      run: |
        yes | sdkmanager --licenses || true

    # 5. Устанавливаем Python
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    # 6. Устанавливаем зависимости Python и flet
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    # 7. Запускаем компиляцию APK-файла.
    # Флаг --no-interactive запрещает утилите Flet задавать вопросы в консоли
    - name: Build APK
      run: |
        flet build apk --module-name Tasker --no-interactive

    # 8. Загружаем готовый APK в артефакты GitHub
    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Tasker-Android-Update
        path: build/apk/app-release.apk
