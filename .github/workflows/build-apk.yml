name: Сборка Flet APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # 1. Скачиваем код вашего репозитория
    - name: Checkout repository
      uses: actions/checkout@v4

    # 2. Устанавливаем Java (необходима для компиляции Android Gradle)
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    # 3. Устанавливаем стабильную версию Flutter SDK
    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'

    # 4. Автоматически принимаем все лицензии Android SDK в тихом режиме
    - name: Accept Android Licenses
      run: |
        yes | sdkmanager --licenses || true

    # 5. Устанавливаем Python
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    # 6. Устанавливаем зависимости Python и flet
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    # [НОВЫЙ ШАГ] Декодируем постоянный ключ из секретов GitHub в файл
    - name: Decode Keystore
      run: |
        python -c "import base64; import os; f = open('tasker-release-key.jks', 'wb'); f.write(base64.b64decode('''${{ secrets.KEYSTORE_BASE64 }}''')); f.close()"

    # 7. Запускаем компиляцию APK-файла с передачей ключей подписи
    - name: Build APK
      run: |
        yes | flet build apk --module-name Tasker
      env:
        FLET_ANDROID_SIGNING_KEY_STORE: '${{ github.workspace }}/tasker-release-key.jks'
        FLET_ANDROID_SIGNING_KEY_STORE_PASSWORD: '${{ secrets.KEYSTORE_PASSWORD }}'

    # 8. Загружаем готовый APK в артефакты GitHub
    # В утилите flet build apk путь к собранному файлу обычно 'build/apk' (проверьте логи, если файл переименован)
    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Tasker-Android-Update
        path: build/apk
