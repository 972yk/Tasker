app:
  # 1. НАЗВАНИЕ ПРИЛОЖЕНИЯ
  name: "Менеджер Задач"

  # 2. ИДЕНТИФИКАТОР ПАКЕТА (ГЛАВНОЕ УСЛОВИЕ)
  # Этот ID должен быть СТРОГО ОДИНАКОВЫМ для всех версий вашего приложения.
  # Если вы измените хотя бы одну букву, Android установит приложение РЯДОМ, как новое.
  package: "com.home.tasker"

  # 3. ВЕРСИЯ ДЛЯ ПОЛЬЗОВАТЕЛЯ
  # Текстовая строка, которую пользователь видит в настройках телефона (например, 1.0.1)
  version: "1.0.1"

  # 4. КОД ВЕРСИИ ДЛЯ ANDROID (УСЛОВИЕ ОБНОВЛЕНИЯ)
  # Это целое число (Integer). При каждом новом релизе его нужно увеличивать ровно на +1.
  # Android разрешит установку ПОВЕРХ старого приложения, только если build_version НОВОГО APK больше, чем у старого.
  build_version: 2
